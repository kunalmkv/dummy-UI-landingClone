<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>chakra auth harness — reset password</title>
    <link rel="stylesheet" href="/app.css" />
    <style>
      /* app.css gives .identity and label a display, which beats [hidden]. */
      [hidden] {
        display: none !important;
      }
      a {
        color: var(--accent);
      }
      .outcome {
        margin: 0.6rem 0 0;
        font-size: 12.5px;
      }
      .outcome:empty {
        display: none;
      }
    </style>
  </head>
  <body>
    <header>
      <nav data-nav></nav>
      <div id="identity" class="identity signed-out">
        <strong>checking…</strong>
      </div>
    </header>

    <main>
      <div>
        <section>
          <h2>Reset password</h2>
          <p class="hint">
            <code>POST /auth/password/reset</code> — single use. A reset signs
            out <strong>every</strong> session and clears the sign-in lockout;
            it does not sign you in here. No link? Ask for one on the
            <a href="/account">account page</a>.
          </p>
          <p class="note" id="token-note" hidden>
            Token read from the link — choose a new password to spend it.
          </p>
          <form id="reset-form">
            <label>
              token
              <textarea name="token" id="token" rows="3" required></textarea>
            </label>
            <label>
              new password — 10 to 72 bytes
              <input type="text" name="newPassword" required />
            </label>
            <button type="submit">set new password</button>
          </form>
          <p class="outcome" id="reset-outcome"></p>
        </section>
      </div>

      <div class="sticky-col">
        <div id="response-panel" class="panel">
          <div class="panel-head">
            <span class="muted">no request yet</span>
          </div>
        </div>
      </div>
    </main>

    <script src="/api.js"></script>
    <script src="/ui.js"></script>
    <script>
      const token = new URLSearchParams(location.search).get("token") ?? "";
      document.getElementById("token").value = token;
      document.getElementById("token-note").hidden = token === "";

      onSubmit("reset-form", async (values) => {
        const result = await api.post("/auth/password/reset", {
          token: values.token.trim(),
          newPassword: values.newPassword,
        });
        document.getElementById("reset-outcome").innerHTML = result.ok
          ? 'password reset — every session is signed out. <a href="/account">Sign in with the new one →</a>'
          : escapeHtml(result.error ?? result.statusName);
        return result;
      });
    </script>
  </body>
</html>
